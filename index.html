<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Video Downloader</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #111827, #2563eb);
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 500px;
      background: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    h1 {
      margin-bottom: 10px;
      color: #111827;
    }

    p {
      color: #6b7280;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .note {
      margin-top: 18px;
      font-size: 12px;
      color: #6b7280;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>🎬 My Video Downloader</h1>

    <p>
      Apni khud ki ya authorized video ka direct file link paste karein.
    </p>

    <input
      type="url"
      id="videoUrl"
      placeholder="Paste direct video URL..."
    >

    <button onclick="downloadVideo()">
      ⬇️ Download Video
    </button>

    <div class="note">
      Only download videos/files that you own or have permission to download.
    </div>
  </div>

  <script>
    function downloadVideo() {
      const url = document.getElementById("videoUrl").value.trim();

      if (!url) {
        alert("Please paste a video URL first.");
        return;
      }

      try {
        new URL(url);
      } catch {
        alert("Please enter a valid URL.");
        return;
      }

      const link = document.createElement("a");
      link.href = url;
      link.download = "";
      link.target = "_blank";

      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>

</body>
</html>
